name: Docs

# Actions are SHA-pinned; the trailing `# vX` marks the human-readable version.
# Builds the mkdocs-material site and deploys to GitHub Pages.
#
# The build is what verifies the docs (`mkdocs build --strict` fails on a broken link), so it runs
# unconditionally and the artifact is uploaded either way. Only the deployment is gated: Pages is
# not enabled on this repository, and `actions/deploy-pages` answers that with
# `404 ... Ensure GitHub Pages has been enabled`, which turned a working docs build into a red
# check on every push to main.

on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: caps
        uses: ./.github/actions/repo-capabilities
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      - name: Build site
        run: uv run --group docs mkdocs build --strict
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site
      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
        if: steps.caps.outputs.pages == 'true'
