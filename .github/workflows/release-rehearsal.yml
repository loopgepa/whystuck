name: Release Rehearsal

# Actions are SHA-pinned (`# vX` marks the version). Dry-runs the release pipeline
# (build + SBOM) WITHOUT publishing, so a real tag never surprises us.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rehearse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Version consistency
        run: bash scripts/check_versions.sh
      - name: Build
        run: uv build
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          artifact-name: whystuck-sbom.spdx.json
      - name: List artifacts (no publish)
        run: ls -la dist/
