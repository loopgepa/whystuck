name: CI

# Actions are SHA-pinned (`# vX` marks the version). uv.lock is committed, so CI
# runs with --frozen (never `uv sync -U`). See LAUNCH_CHECKLIST.md.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync
        # `--extra eval` is required, not optional: gepa and litellm live in that extra, and the
        # claim checks replay recorded runs through the study CLI, which imports both. Without it
        # every replay subprocess exits non-zero, `measured_depth` returns None for every cell,
        # and pytest dies during COLLECTION because the checks are parametrized over `_checks()`.
        # No API key is needed and nothing is spent -- replay serves committed cassettes.
        run: uv sync --dev --extra eval --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy src/whystuck

      - name: Test
        run: uv run pytest
