name: Scorecard

# Actions are SHA-pinned; the trailing `# vX` marks the human-readable version.
# Advisory only -- feeds the README badge, not a merge gate.
#
# Two separate reasons this failed on every run. First, `contents: read` was missing: a job-level
# `permissions:` block REPLACES the workflow-level `read-all` rather than extending it, so the token
# could not clone and `actions/checkout` reported `fatal: repository ... not found` -- a 404, because
# a private repository does not admit its own existence to an unauthorised caller. Second, Scorecard
# scores public-repository hygiene, and both publishing the result and uploading the SARIF need a
# public repository, so the analysis itself is gated on that.

on:
  branch_protection_rule:
  schedule:
    - cron: "30 6 * * 1"
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - id: caps
        uses: ./.github/actions/repo-capabilities
      - if: steps.caps.outputs.public == 'true'
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - if: steps.caps.outputs.public == 'true'
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd  # v4.37.7
        with:
          sarif_file: results.sarif
