name: Release

# Actions are SHA-pinned (`# vX` marks the version). Tag-triggered; never cancels
# mid-flight; publish is idempotent (skips if the version is already on PyPI).

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+.dev[0-9]+"
  workflow_dispatch:

permissions:
  contents: write # create the GitHub release
  id-token: write # build-provenance attestation
  attestations: write # upload it; actions/attest-build-provenance fails without this

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: caps
        uses: ./.github/actions/repo-capabilities

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Preflight — version consistency
        run: bash scripts/check_versions.sh

      - name: Preflight — publish token present
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          if [ -z "${UV_PUBLISH_TOKEN:-}" ]; then
            echo "PYPI_TOKEN secret is not set" >&2
            exit 1
          fi

      - name: Build
        run: uv build

      - name: SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          artifact-name: whystuck-sbom.spdx.json

      # Artifact attestations are available in public repositories on every plan, but in a private
      # one only under GitHub Enterprise Cloud, so this step cannot succeed here. It sits before
      # `uv publish`, so leaving it ungated means the first real tag fails after the build and
      # before anything is published -- a fail-closed break, but a break, and this workflow has
      # never run, so nothing would have caught it. No document claims provenance for releases, so
      # skipping it while private withdraws no published guarantee, and it starts attesting on its
      # own once the repository is public.
      - name: Attest build provenance
        if: steps.caps.outputs.public == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Publish to PyPI (idempotent)
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          version=$(grep -oP '(?<=^version = ")[^"]+' pyproject.toml | head -1)
          if curl -fsS "https://pypi.org/pypi/whystuck/${version}/json" >/dev/null 2>&1; then
            echo "whystuck ${version} already on PyPI — skipping (idempotent)."
          else
            uv publish
          fi

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --generate-notes --verify-tag \
            || gh release upload "$TAG" dist/* --clobber
