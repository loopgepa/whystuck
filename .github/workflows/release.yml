name: Release

# Actions are SHA-pinned (`# vX` marks the version). Tag-triggered; never cancels
# mid-flight; publish is idempotent (skips if the version is already on PyPI).

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+.dev[0-9]+"
  workflow_dispatch:

permissions:
  contents: write # create the GitHub release
  id-token: write # build-provenance attestation

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Preflight — version consistency
        run: bash scripts/check_versions.sh

      - name: Preflight — publish token present
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          if [ -z "${UV_PUBLISH_TOKEN:-}" ]; then
            echo "PYPI_TOKEN secret is not set" >&2
            exit 1
          fi

      - name: Build
        run: uv build

      - name: SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          artifact-name: whystuck-sbom.spdx.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "dist/*"

      - name: Publish to PyPI (idempotent)
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          version=$(grep -oP '(?<=^version = ")[^"]+' pyproject.toml | head -1)
          if curl -fsS "https://pypi.org/pypi/whystuck/${version}/json" >/dev/null 2>&1; then
            echo "whystuck ${version} already on PyPI — skipping (idempotent)."
          else
            uv publish
          fi

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --generate-notes --verify-tag \
            || gh release upload "$TAG" dist/* --clobber
