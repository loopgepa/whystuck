name: Secret Scan

# Actions are SHA-pinned; the trailing `# vX` marks the human-readable version.
# Verified-only mode: fires only on secrets that still authenticate (no noise).
#
# It passed on pull requests and failed on its weekly schedule, which is the shape to watch for: the
# action derives `--since-commit`/`--branch` from the event and leaves both empty for `schedule` and
# `workflow_dispatch`, so those are the only runs that scan all history. Three detectors fire there,
# none on a secret:
#
#   * Lob matches `\b((live|test)_[a-zA-Z0-9_]{35})\b`, which is satisfied by any pytest function
#     whose name runs to exactly 35 characters after `test_`. This repository's naming convention
#     produces those in quantity: `test_the_author_block_has_no_placeholder` is one of 28, across 19
#     test files, and 28 is exactly the count the failing run reported. Its verifier POSTs to
#     `api.lob.com/v1/us_verifications` and counts HTTP 403 and 422 as success, so a well-formed
#     fake reports as a credential that authenticates.
#   * PhraseAccessToken matches a bare 64-hex string, and every one of the 267 cassettes is keyed by
#     the sha256 of its request -- so it matched every fixture in the repository.
#   * FTP matches the BigCodeBench task text in `study-bcb-act*.json`, whose "credentials" are the
#     f-string placeholders `ftp://{ftp_user}:{ftp_password}@{ftp_server}`.
#
# Excluding those three detectors keeps every path in scope, which a path exclusion would not: a
# real key committed into a cassette or a test file is still caught. `tests/test_ci_workflows.py`
# measures which detectors the tracked tree actually trips and requires this list to equal that set
# in both directions, so it cannot grow into a blanket suppression or go stale.
#
# Lob was missed on the first attempt at this fix, and the reason is worth keeping: it was verified
# locally with `--no-verification`, which is NOT a superset of a verified scan. Detectors that only
# emit a result once verification succeeds are invisible to it, so the local run showed zero
# findings while the dispatched run still failed with 28. `workflow_dispatch` is what caught that.

on:
  pull_request:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@55db46bee4d7b63eb1197f0ca2aac089a168f7b4  # main
        with:
          extra_args: --results=verified --only-verified --exclude-detectors=Lob,PhraseAccessToken,FTP
