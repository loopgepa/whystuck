name: Secret Scan

# NOTE (launch gate): SHA-pin actions with a `# vX` comment before going public.
# Verified-only mode: fires only on secrets that still authenticate (no noise).

on:
  pull_request:
  schedule:
    - cron: "0 7 * * 1"

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified --only-verified
