name: Secret Scan

# Actions are SHA-pinned; the trailing `# vX` marks the human-readable version.
# Verified-only mode: fires only on secrets that still authenticate (no noise).

on:
  pull_request:
  schedule:
    - cron: "0 7 * * 1"

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@ec20cb388c8cef130f0eb746be4afa8a75d8051c  # main
        with:
          extra_args: --results=verified --only-verified
