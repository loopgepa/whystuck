name: Secret Scan

# Actions are SHA-pinned; the trailing `# vX` marks the human-readable version.
# Verified-only mode: fires only on secrets that still authenticate (no noise).

on:
  pull_request:
  schedule:
    - cron: "0 7 * * 1"

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@38999f88bed87fce0861ac313cbca06267b439c7  # main
        with:
          extra_args: --results=verified --only-verified
