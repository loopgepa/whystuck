name: Secret Scan

# Actions are SHA-pinned; the trailing `# vX` marks the human-readable version.
# Verified-only mode: fires only on secrets that still authenticate (no noise).
#
# It passed on pull requests and failed on its weekly schedule, which is the shape to watch for: the
# action derives `--since-commit`/`--branch` from the event and leaves both empty for `schedule` and
# `workflow_dispatch`, so those are the only runs that scan all history. Two detectors fire there,
# neither on a secret:
#
#   * PhraseAccessToken matches a bare 64-hex string, and every one of the 267 cassettes is keyed by
#     the sha256 of its request -- so it matched every fixture in the repository.
#   * FTP matches the BigCodeBench task text in `study-bcb-act*.json`, whose "credentials" are the
#     f-string placeholders `ftp://{ftp_user}:{ftp_password}@{ftp_server}`.
#
# Excluding those two detectors keeps every path in scope, which a path exclusion would not: a real
# key committed into a cassette is still caught. `tests/test_ci_workflows.py` measures which
# detectors the tracked fixtures actually trip and requires this list to equal that set in both
# directions, so it cannot grow into a blanket suppression or go stale if the fixtures change.

on:
  pull_request:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@38999f88bed87fce0861ac313cbca06267b439c7  # main
        with:
          extra_args: --results=verified --only-verified --exclude-detectors=PhraseAccessToken,FTP
