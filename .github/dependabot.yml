version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels: ["dependencies"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
    # Keep codeql-action/init and /analyze in one PR — they must move together
    # (a mismatched init/analyze version fails with a config-version error).
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
