name: Feature request
description: Suggest an improvement to WhyStuck.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the concrete failure or friction, not just the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This keeps WhyStuck local-only (no cloud, no telemetry).
          required: true
        - label: I've checked ROADMAP.md and DECISIONS.md for an existing decision.
          required: false
