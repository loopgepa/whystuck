[project]
name = "whystuck"
version = "0.1.0.dev0"
description = "Local, zero-telemetry diagnosis and reversible repair of coding-agent loops. An MCP server for Claude Code, Codex, and Cursor."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "WhyStuck contributors" }]
keywords = ["mcp", "claude-code", "codex", "cursor", "agents", "gepa", "llm", "observability"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "fastmcp>=3.4.6,<4",
    "pydantic>=2.7",
    "ruamel.yaml>=0.18",
]

# `uvx whystuck` and `claude mcp add whystuck -- uvx whystuck` both resolve to this.
# `whystuck setup` (or the `whystuck-setup` alias) runs the client-config wizard.
[project.scripts]
whystuck = "whystuck.server:main"
whystuck-setup = "whystuck.setup:main"

[project.urls]
Homepage = "https://github.com/loopgepa/whystuck"
Repository = "https://github.com/loopgepa/whystuck"
Issues = "https://github.com/loopgepa/whystuck/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whystuck"]

[project.optional-dependencies]
# v0.2 measured evaluation / GEPA-wrapped optimization. Kept optional so the core
# stays offline and dependency-light (ADR-011).
# numpy is required by the v2 code study's held-out scorer: the vendored MBPP+
# plus-test harnesses import it (np.allclose float comparisons). Pinned to one BLAS
# thread at execution time (eval/code_exec.py) for determinism.
eval = ["gepa>=0.1,<0.2", "litellm>=1.95.0,<2", "numpy>=1.26"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.16.1",
    "mypy>=1.11",
    # The code-exec / code_bench tests execute vendored MBPP+ plus-test harnesses,
    # which import numpy in the sandboxed subprocess (== this interpreter under pytest).
    "numpy>=1.26",
]
docs = [
    "mkdocs-material>=9.5",
]
# Paper figures only. Kept out of `dev` so the ordinary test path stays light: the figure
# module's data layer is pure and imports matplotlib lazily inside `render`, which is what lets
# `test_figures.py` check every plotted number against the paper without a plotting stack.
figures = ["matplotlib>=3.8"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The plugin hook is a standalone zero-dep script that must run under any python3
# (including <3.11), so keep pre-3.11 idioms like timezone.utc.
"plugin/hooks/*" = ["UP", "SIM105"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/whystuck"]

# The eval extra (gepa, litellm) is OPTIONAL by ADR-011, so without this override mypy gives a
# DIFFERENT verdict depending on whether it happens to be installed: absent, `import gepa` needs
# an `import-not-found` ignore; present, that same ignore is flagged unused under strict. A gate
# whose colour tracks the environment is not a gate --- this one reported "Success: no issues" for
# as long as the extra was missing from the venv, while seven errors waited behind the import.
# `follow_imports = "skip"` pins both modes to one answer by treating these modules as untyped
# whether or not they can be imported. Their surfaces become Any, which strict's
# disallow_subclassing_any still catches at the adapter bridge, so the boundary stays checked; it
# just stops depending on an install. Keep the bare names alongside the globs: mypy's `X.*` is
# documented to cover X itself, and relying on that is a needless bet.
[[tool.mypy.overrides]]
module = ["gepa", "gepa.*", "litellm", "litellm.*"]
ignore_missing_imports = true
follow_imports = "skip"
