[project]
name = "whystuck"
version = "0.1.0.dev0"
description = "Local, zero-telemetry diagnosis and reversible repair of coding-agent loops. An MCP server for Claude Code, Codex, and Cursor."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "WhyStuck contributors" }]
keywords = ["mcp", "claude-code", "codex", "cursor", "agents", "gepa", "llm", "observability"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "fastmcp>=3,<4",
    "pydantic>=2.7",
    "ruamel.yaml>=0.18",
]

# `uvx whystuck` and `claude mcp add whystuck -- uvx whystuck` both resolve to this.
[project.scripts]
whystuck = "whystuck.server:main"

[project.urls]
Homepage = "https://github.com/whystuck/whystuck"
Repository = "https://github.com/whystuck/whystuck"
Issues = "https://github.com/whystuck/whystuck/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whystuck"]

[project.optional-dependencies]
# v0.2 measured evaluation / GEPA-wrapped optimization. Kept optional so the core
# stays offline and dependency-light (ADR-011).
eval = ["gepa>=0.1,<0.2"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]
docs = [
    "mkdocs-material>=9.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/whystuck"]
