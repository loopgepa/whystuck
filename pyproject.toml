[project]
name = "loopgepa"
version = "0.1.0.dev0"
description = "Trace-driven diagnosis and reversible improvement of Claude Code agent loops."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "LoopGEPA contributors" }]
keywords = ["claude-code", "mcp", "agents", "gepa", "llm", "workflow"]
dependencies = [
    "loopgepa-core",
    "loopgepa-mcp",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
loopgepa-core = { workspace = true }
loopgepa-mcp = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["packages"]

[tool.mypy]
python_version = "3.12"
strict = true
