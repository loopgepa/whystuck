[project]
name = "loopgepa-mcp"
version = "0.1.0.dev0"
description = "LoopGEPA MCP stdio server: thin tool layer over loopgepa-core."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "loopgepa-core",
    "mcp>=1.2",
]

[project.scripts]
loopgepa-mcp = "loopgepa_mcp.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loopgepa_mcp"]

[tool.uv.sources]
loopgepa-core = { workspace = true }
