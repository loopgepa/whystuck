[project]
name = "loopgepa-core"
version = "0.1.0.dev0"
description = "LoopGEPA core: models, storage, runner, mutation, diff, safety."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.7",
    "ruamel.yaml>=0.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loopgepa_core"]
