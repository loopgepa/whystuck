site_name: WhyStuck
site_description: Local, zero-telemetry diagnosis and reversible repair of coding-agent loops.
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.sections
    - content.code.copy
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - How it works: how-it-works.md
  - User stories: user-stories.md
  - Trust & safety: safety.md
  - Comparison: comparison.md
  - Design records:
      - v0.2 — eval & benchmark: v0.2-eval-benchmark.md
      - Competitive & launch notes: COMPETITIVE-AND-LAUNCH.md
markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight
