site_name: WhyStuck
site_description: Local, zero-telemetry diagnosis and reversible repair of coding-agent loops.
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.sections
    - content.code.copy
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - How it works: how-it-works.md
  - User stories: user-stories.md
  - Trust & safety: safety.md
  - Comparison: comparison.md
  - Validation study — results note (all runs): validation-study-summary.md
  - Validation study: validation-study.md
  - Validation study (multi-constraint): validation-study-multi.md
  - Validation study (multi-constraint, hard): validation-study-multihard.md
  - Validation study (feedback richness): validation-study-feedback.md
  - Validation study (complexity / plan gene): validation-study-plan.md
  - Design records:
      - ADR index: design-records.md
      - v0.2 — eval & benchmark: v0.2-eval-benchmark.md
      - Competitive & launch notes: COMPETITIVE-AND-LAUNCH.md
# Internal design specs live under docs/ for co-location but are not part of the
# published site. Without this, mkdocs builds them as unlinked, URL-reachable
# orphan pages (it does NOT fail --strict — an unlinked page is only an INFO-level
# notice at this mkdocs version). Excluding them keeps the spec out of site/.
exclude_docs: |
  superpowers/

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight
